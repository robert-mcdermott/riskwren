# nginx in front of RiskWren. Point ssl_certificate at your own certificate.
server {
    listen 443 ssl;
    http2 on;
    server_name grc.example.org;

    ssl_certificate     /etc/ssl/certs/grc.example.org.pem;
    ssl_certificate_key /etc/ssl/private/grc.example.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 33m;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Reports made without a name keep no address. Keep the proxy from keeping one either.
    location ~ ^/(report|api/v1/anonymous-reports) {
        access_log off;
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name grc.example.org;
    return 301 https://$host$request_uri;
}
